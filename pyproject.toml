[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octagon"
version = "0.1.0"
description = "Combat sports computer vision analysis platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "OctagonBrain Team" }
]
keywords = ["computer-vision", "pose-estimation", "combat-sports", "mma", "boxing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",

    # Computer Vision
    "opencv-python>=4.8.0",
    "ultralytics>=8.1.0",  # YOLO11
    "mediapipe>=0.10.0",   # BlazePose

    # API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",

    # Data Processing
    "pandas>=2.0.0",       # For BoxingVI Excel annotations
    "openpyxl>=3.1.0",     # Excel file support

    # Utilities
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "ruff>=0.1.0",
]
training = [
    "tensorboard>=2.15.0",
    "wandb>=0.16.0",
    "albumentations>=1.3.0",
    "einops>=0.7.0",  # SkateFormer dependency
    "timm>=0.9.0",    # SkateFormer dependency
]
inference = [
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.16.0",
]
all = [
    "octagon[dev,training,inference]",
]

[project.urls]
Documentation = "https://github.com/octagon-brain/octagon-brain-cv#readme"
Repository = "https://github.com/octagon-brain/octagon-brain-cv"
Issues = "https://github.com/octagon-brain/octagon-brain-cv/issues"

[project.scripts]
octagon = "octagon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/octagon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hatch
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["octagon"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "mediapipe.*",
    "cv2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=src/octagon",
    "--cov-report=term-missing",
]

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
